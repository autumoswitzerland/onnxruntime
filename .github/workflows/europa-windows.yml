name: Europa Windows

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows x86_64
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy

      - name: Configure ONNX Runtime
        shell: pwsh
        run: |
          $env:ONNX_ML = "1"
          $env:CMAKE_ARGS = "-DONNX_GEN_PB_TYPE_STUBS=ON -DONNX_WERROR=OFF"

          python.exe tools\ci_build\build.py `
            --update `
            --config Release `
            --build_dir build `
            --skip_submodule_sync `
            --parallel `
            --build_shared_lib `
            --cmake_generator "Visual Studio 17 2022" `
            --cmake_extra_defines `
              FETCHCONTENT_TRY_FIND_PACKAGE_MODE=NEVER `
              onnxruntime_USE_TELEMETRY=OFF `
              onnxruntime_BUILD_UNIT_TESTS=OFF `
              onnxruntime_GENERATE_TEST_REPORTS=OFF

      - name: Build ONNX Runtime
        shell: pwsh
        run: |
          $env:ONNX_ML = "1"
          $env:CMAKE_ARGS = "-DONNX_GEN_PB_TYPE_STUBS=ON -DONNX_WERROR=OFF"

          python.exe tools\ci_build\build.py `
            --build `
            --config Release `
            --build_dir build `
            --skip_submodule_sync `
            --parallel `
            --build_shared_lib `
            --cmake_generator "Visual Studio 17 2022" `
            --cmake_extra_defines `
              FETCHCONTENT_TRY_FIND_PACKAGE_MODE=NEVER `
              onnxruntime_USE_TELEMETRY=OFF `
              onnxruntime_BUILD_UNIT_TESTS=OFF `
              onnxruntime_GENERATE_TEST_REPORTS=OFF

      - name: Verify
        shell: pwsh
        run: |
          Get-Item build\Release\onnxruntime.dll
          Select-String "onnxruntime_USE_TELEMETRY" build\Release\CMakeCache.txt

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build\Release\onnxruntime.dll artifact\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-windows-x86_64
          path: artifact/
