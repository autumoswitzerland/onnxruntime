name: Europa Linux

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy

      - name: Configure ONNX Runtime
        run: |
          export ONNX_ML=1
          export CMAKE_ARGS="-DONNX_GEN_PB_TYPE_STUBS=ON -DONNX_WERROR=OFF"

          python tools/ci_build/build.py \
            --update \
            --config Release \
            --build_dir build \
            --skip_submodule_sync \
            --parallel \
            --build_shared_lib \
            --cmake_extra_defines \
              FETCHCONTENT_TRY_FIND_PACKAGE_MODE=NEVER \
              onnxruntime_USE_TELEMETRY=OFF \
              onnxruntime_BUILD_UNIT_TESTS=OFF \
              onnxruntime_GENERATE_TEST_REPORTS=OFF

      - name: Build ONNX Runtime
        run: |
          export ONNX_ML=1
          export CMAKE_ARGS="-DONNX_GEN_PB_TYPE_STUBS=ON -DONNX_WERROR=OFF"

          python tools/ci_build/build.py \
            --build \
            --config Release \
            --build_dir build \
            --skip_submodule_sync \
            --parallel \
            --build_shared_lib \
            --cmake_extra_defines \
              FETCHCONTENT_TRY_FIND_PACKAGE_MODE=NEVER \
              onnxruntime_USE_TELEMETRY=OFF \
              onnxruntime_BUILD_UNIT_TESTS=OFF \
              onnxruntime_GENERATE_TEST_REPORTS=OFF

      - name: Verify
        run: |
          file build/Release/libonnxruntime.so
          grep "onnxruntime_USE_TELEMETRY" build/Release/CMakeCache.txt
          ldd build/Release/libonnxruntime.so

      - name: Package
        run: |
          mkdir -p artifact
          cp -L build/Release/libonnxruntime*.so* artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-linux-x86_64
          path: artifact/
